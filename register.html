<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Paciente - Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="card shadow-lg border-0 p-4" style="border-radius: 16px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-primary fw-bold mb-0">Registrar Nuevo Paciente</h2>
                <a href="dashboard.html" class="btn btn-outline-secondary">Volver al Dashboard</a>
            </div>

            <p class="text-muted small" id="estadoModeloRegistro">Cargando inteligencia artificial para huella biométrica...</p>

            <form onsubmit="guardarNuevoPaciente(event)">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nombre Completo</label>
                        <input type="text" id="nombre" class="form-control" required placeholder="Ej: Santiago">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Tipo Documento</label>
                        <select id="documento" class="form-select" required>
                            <option value="C.C">C.C</option>
                            <option value="T.I">T.I</option>
                            <option value="C.E">C.E</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Número Documento</label>
                        <input type="text" id="numero" class="form-control" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold">Edad</label>
                        <input type="number" id="edad" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Fecha Nacimiento</label>
                        <input type="date" id="fecha" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Grupo Sanguíneo (RH)</label>
                        <select id="rh" class="form-select" required>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Teléfono de Contacto</label>
                        <input type="text" id="telefono" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Municipio / Ciudad</label>
                        <input type="text" id="ciudad" class="form-control" placeholder="Ej: Cajicá, Chía..." required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Dirección / Vereda</label>
                        <input type="text" id="direccion" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-danger">Alergias Críticas</label>
                        <input type="text" id="alergias" class="form-control" placeholder="Ej: Penicilina, AINEs, Ninguna" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-danger">Enfermedades Graves / Antecedentes</label>
                        <input type="text" id="enfermedades" class="form-control" placeholder="Ej: Cáncer, Hipertensión, Diabetes, Ninguna" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Medicamentos Actuales</label>
                        <input type="text" id="medicamentos" class="form-control" placeholder="Ej: Losartán 50mg, Ninguno" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-primary">Contacto de Emergencia (Nombre y Parentesco)</label>
                        <input type="text" id="contacto" class="form-control" placeholder="Ej: Madre - 3001234567" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold">Historia Clínica / Observaciones</label>
                        <textarea id="historial" class="form-control" rows="3" placeholder="Detalle la historia médica previa..." required></textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold text-success">Fotografía del Paciente (Para Reconocimiento Facial IA)</label>
                        <input type="file" id="foto" class="form-control" accept="image/*" required>
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Guardar Paciente y Generar Huella Biométrica</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
