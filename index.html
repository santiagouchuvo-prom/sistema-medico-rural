<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Médico Rural - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow-lg text-center" style="max-width: 420px; width: 100%; border-radius: 16px;">
        <h2 class="text-primary fw-bold mb-1">Sistema Médico</h2>
        <p class="text-muted small mb-4">Puestos de Salud Rurales / Offline-First</p>

        <!-- LOGIN FORM -->
        <input type="text" id="usuario" class="form-control mb-2" placeholder="Usuario">
        <input type="password" id="password" class="form-control mb-3" placeholder="Contraseña">
        <button class="btn btn-primary w-100 fw-bold mb-3" onclick="login()">Ingresar al Sistema</button>

        <hr class="my-3">

        <!-- BOTÓN SOS ACCESO RÁPIDO -->
        <button class="btn btn-danger w-100 py-2 fw-bold shadow-sm" onclick="abrirModalSOS()">
            🚨 EMERGENCIA SOS (Identificar por Rostro)
        </button>
    </div>

    <!-- MODAL RECONOCIMIENTO SOS (IA) -->
    <div class="modal fade" id="sosModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title fw-bold">🚨 Módulo de Emergencia SOS (Reconocimiento Facial IA)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" onclick="detenerCamaraSOS()"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="text-muted" id="sosEstadoTexto">Cargando modelos de reconocimiento facial o esperando cámara...</p>

                    <video id="sosVideo" width="100%" height="280" autoplay class="bg-dark rounded mb-3" style="object-fit: cover;"></video>
                    <canvas id="sosCanvas" style="display:none;"></canvas>

                    <div class="d-grid gap-2">
                        <button class="btn btn-danger btn-lg fw-bold" onclick="capturarYSOS()">📸 Capturar Rostro y Buscar</button>
                        <div class="mt-2 text-start">
                            <label class="form-label small fw-bold text-secondary">O subir fotografía desde galería:</label>
                            <input type="file" id="fotoArchivoSOS" class="form-control" accept="image/*" onchange="cargarArchivoSOS(event)">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- LIBRERÍAS (Bootstrap, Dexie e IA Face-API) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
