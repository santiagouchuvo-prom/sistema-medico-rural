<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Médico Rural</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-primary px-4 shadow-sm">
        <span class="navbar-brand fw-bold fs-4">🏥 Sistema Médico Rural</span>
        <div>
            <span id="badgeRol" class="badge bg-light text-primary me-2"></span>
            <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container my-4">
        <!-- BOTONES DE ACCIÓN -->
        <div class="d-flex flex-wrap gap-2 mb-4">
            <a href="register.html" class="btn btn-success fw-bold" id="btnRegistro">+ Registrar Nuevo Paciente</a>
            <button class="btn btn-danger fw-bold" onclick="abrirModalSOS()">🚨 Reconocimiento SOS Rápido</button>
        </div>

        <div class="row">
            <!-- LISTADO DE PACIENTES -->
            <div class="col-lg-8 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold fs-5">📋 Pacientes Registrados (IndexedDB Offline)</div>
                    <div class="card-body">
                        <div class="row" id="patientsContainer">
                            <!-- Se carga dinámicamente con JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- GESTIÓN DE CITAS / TRIAJE -->
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white fw-bold fs-5">📅 Agendar Cita Médica (Triaje / IA)</div>
                    <div class="card-body">
                        <form id="formCita" onsubmit="agendarCita(event)">
                            <select id="citaPaciente" class="form-select mb-2" required>
                                <option value="">Seleccione Paciente...</option>
                            </select>

                            <label class="form-label small fw-bold mb-1">Nivel de Urgencia (Triaje):</label>
                            <select id="citaPrioridad" class="form-select mb-2" required>
                                <option value="Baja">🟢 Baja (Consulta General)</option>
                                <option value="Media">🟡 Media (Atención Prioritaria)</option>
                                <option value="Alta">🔴 Alta (Urgencia Vital)</option>
                            </select>

                            <input type="text" id="citaMotivo" class="form-control mb-3" placeholder="Motivo de consulta / síntomas" required>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Agendar & Asignar Centro</button>
                        </form>
                    </div>
                </div>

                <!-- LISTA DE CITAS -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold fs-5">📌 Citas Programadas</div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="citasContainer">
                            <!-- Se carga dinámicamente -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL RECONOCIMIENTO SOS (IA) -->
    <div class="modal fade" id="sosModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title fw-bold">🚨 Reconocimiento Facial de Emergencia (IA)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" onclick="detenerCamaraSOS()"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="text-muted" id="sosEstadoTexto">Cargando modelos de IA...</p>
                    <video id="sosVideo" width="100%" height="280" autoplay class="bg-dark rounded mb-3" style="object-fit: cover;"></video>
                    <canvas id="sosCanvas" style="display:none;"></canvas>
                    <div class="d-grid gap-2">
                        <button class="btn btn-danger btn-lg fw-bold" onclick="capturarYSOS()">📸 Capturar Rostro y Buscar</button>
                        <input type="file" id="fotoArchivoSOS" class="form-control" accept="image/*" onchange="cargarArchivoSOS(event)">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE EDICIÓN DE PACIENTE (SOLO ADMIN - INCLUYE CAMBIO DE FOTO) -->
    <div class="modal fade" id="editarModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title fw-bold">✏️ Modificar Perfil y Fotografía de Paciente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditarPaciente" onsubmit="guardarEdicionPaciente(event)">
                        <input type="hidden" id="editId">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Nombre Completo</label>
                                <input type="text" id="editNombre" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Teléfono</label>
                                <input type="text" id="editTelefono" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-danger">Alergias Críticas</label>
                                <input type="text" id="editAlergias" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-danger">Enfermedades Graves / Antecedentes</label>
                                <input type="text" id="editEnfermedades" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Medicamentos Actuales</label>
                                <input type="text" id="editMedicamentos" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Contacto de Emergencia</label>
                                <input type="text" id="editContacto" class="form-control" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Historia Clínica / Observaciones</label>
                                <textarea id="editHistorial" class="form-control" rows="3" required></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold text-success">Actualizar Fotografía (Opcional - Dejar vacío para mantener la actual)</label>
                                <input type="file" id="editFoto" class="form-control" accept="image/*">
                            </div>
                            <div class="col-12 mt-3">
                                <button type="submit" class="btn btn-warning w-100 fw-bold">Guardar Cambios</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
